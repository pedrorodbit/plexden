name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # ---------------------------------------------------------------- lint ---
  # Sintaxe de tudo, uma vez, no ambiente padrao do runner.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sintaxe dos scripts shell (bash -n)
        run: |
          bash -n install.sh
          bash -n provision.sh
          bash -n .github/e2e.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -e SC1091 install.sh provision.sh .github/e2e.sh

      - name: Sintaxe do plexden (Python)
        run: python3 -c "import ast; ast.parse(open('plexden').read())"

  # ------------------------------------------------------------- distros ---
  # Em cada familia de distro, roda 'provision.sh --check' (dry-run, sem
  # instalar nada) e confere que o gerenciador certo foi detectado e que o
  # plexden compila sob o python daquela distro.
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable-slim
            pkg: apt-get
          - image: fedora:latest
            pkg: dnf
          - image: almalinux:9
            pkg: dnf
          - image: opensuse/leap:latest
            pkg: zypper
          - image: archlinux:latest
            pkg: pacman
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Dependencias minimas (python3 + git p/ o checkout)
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq python3 git
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y -q python3 git
          elif command -v zypper >/dev/null 2>&1; then
            # sem o refresh, os metadados da imagem ficam atras dos mirrors e a
            # instalacao morre com 404 em pacote que ja rodou de versao
            zypper -n --gpg-auto-import-keys refresh
            zypper -n install python3 git
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm --needed archlinux-keyring
            pacman -S  --noconfirm --needed python git
          fi

      - uses: actions/checkout@v5

      - name: provision.sh --check detecta o gerenciador certo
        run: |
          out=$(bash provision.sh --check)
          echo "$out"
          echo "$out" | grep -q "gerenciador detectado: ${{ matrix.pkg }}"
          echo "$out" | grep -q "plexden: sintaxe Python OK"

      - name: plexden compila sob o python desta distro
        run: |
          python3 -c "import ast, sys; ast.parse(open('plexden').read()); print('plexden OK sob Python', sys.version.split()[0])"

  # ------------------------------------------------------------ e2e deb ---
  # Instalacao de verdade, ponta a ponta: o install.sh completo num container
  # Debian descartavel, e depois a bateria do .github/e2e.sh (servicos no ar,
  # login na WebUI, pause/resume, hardlink). E o unico tipo de job que muta o
  # sistema.
  e2e-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:stable-slim
    steps:
      # De proposito NAO instalamos curl: o install.sh tem que se virar sozinho
      # (ensure_curl) — esse caminho tambem faz parte do teste.
      - name: Dependencias do checkout (sem curl)
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates
          ! command -v curl || { echo "curl ja existe: ensure_curl nao seria testado"; exit 1; }

      - uses: actions/checkout@v5

      # PLEXDEN_RAW aponta para o proprio checkout: o raw.githubusercontent e
      # cacheado por CDN e serviria os arquivos do commit anterior, fazendo o
      # job testar codigo velho (ou passar verde em cima dele). O caminho de
      # rede continua coberto pelo job "urls-publicas".
      # $PWD, e nao github.workspace: a expressao devolve o caminho no host, que
      # nao existe dentro do container (la o checkout fica montado em /__w).
      - name: install.sh completo (instala e sobe a stack)
        env:
          PLEXDEN_HOME: /srv/plexden
          PLEXDEN_USER: plex
        run: PLEXDEN_RAW="file://$PWD" bash install.sh

      - name: Bateria de verificacao
        run: bash .github/e2e.sh "$PWD"

      - name: Logs, se algo falhar
        if: failure()
        run: |
          tail -n 60 /srv/plexden/config/*.log 2>/dev/null || true
          ls -la /srv/plexden /home/plex 2>/dev/null || true
          cat /home/plex/.config/qBittorrent/qBittorrent.conf 2>/dev/null || true

  # ------------------------------------------------------------ e2e rpm ---
  # Mesmo teste na familia RPM. Aqui nao da para usar 'container:' como no
  # Debian: o .rpm do Plex tem um scriptlet %pre que aborta a instalacao com
  # "Plex Media Server requires systemd" — o .deb nao faz isso. Entao o job
  # constroi uma imagem Fedora com systemd e a roda privilegiada, para o PID 1
  # ser systemd de verdade. Sem isso, o ramo rpm do provision.sh e' impossivel
  # de exercitar.
  e2e-rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Imagem Fedora com systemd
        run: |
          docker build -t fedora-systemd - <<'DOCKERFILE'
          FROM fedora:latest
          RUN dnf -y install systemd procps-ng && dnf clean all
          CMD ["/usr/sbin/init"]
          DOCKERFILE

      - name: Sobe o container e espera o systemd
        run: |
          docker run -d --name plexden-rpm --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/repo:ro" fedora-systemd
          for _ in $(seq 1 60); do
            s=$(docker exec plexden-rpm systemctl is-system-running 2>/dev/null || true)
            case "$s" in running|degraded) echo "systemd: $s"; exit 0 ;; esac
            sleep 2
          done
          echo "systemd nao ficou pronto (ultimo estado: ${s:-nenhum})"
          docker logs plexden-rpm | tail -30
          exit 1

      # O checkout e montado read-only, entao o install.sh copia dele para o
      # /srv/plexden do container — igual ao que faz baixando da internet.
      - name: install.sh completo (instala e sobe a stack)
        run: |
          docker exec -e PLEXDEN_HOME=/srv/plexden -e PLEXDEN_USER=plex \
            -e PLEXDEN_RAW=file:///repo plexden-rpm bash /repo/install.sh

      - name: Bateria de verificacao
        run: docker exec plexden-rpm bash /repo/.github/e2e.sh /repo

      - name: Logs, se algo falhar
        if: failure()
        run: |
          docker exec plexden-rpm sh -c 'tail -n 60 /srv/plexden/config/*.log' 2>/dev/null || true
          docker exec plexden-rpm ls -la /srv/plexden /home/plex 2>/dev/null || true
          docker exec plexden-rpm cat /home/plex/.config/qBittorrent/qBittorrent.conf 2>/dev/null || true

  # ------------------------------------------------------ urls publicas ---
  # O one-liner do README depende dessas URLs; os jobs e2e instalam do checkout
  # de proposito, entao e' esta a checagem que garante que o caminho publico nao
  # quebrou.
  urls-publicas:
    runs-on: ubuntu-latest
    steps:
      - name: As quatro URLs do one-liner respondem
        run: |
          for f in install.sh plexden provision.sh credentials.env.example; do
            u="https://raw.githubusercontent.com/${{ github.repository }}/main/$f"
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u" || true)
            [ "$c" = 200 ] || { echo "$f -> HTTP $c"; exit 1; }
            echo "  $f HTTP 200"
          done
